name: Synthetic application checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Django and pytest / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      DJANGO_SETTINGS_MODULE: mnemex.web.settings.test
      MNEMEX_TEST_SUPABASE: '0'
      MNEMEX_VISION_PROVIDER_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application, test tools and STRATHMARK 2.x contract
        run: python -m pip install -e ".[dev,strathmark]"
      - name: Django system checks
        run: python manage.py check --settings=mnemex.web.settings.test
      - name: Reject migration drift
        run: python manage.py makemigrations --check --dry-run --settings=mnemex.web.settings.test
      - name: Run synthetic tests
        run: python -m pytest -q -p no:cacheprovider --junitxml=test-results.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synthetic-tests-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 14
