{% extends "results/base.html" %}{% block title %}Sign in{% endblock %}{% block content %}<section class="panel auth"><p class="eyebrow">Private operator workspace</p><h1>Sign in to Results Desk</h1>{% if form.errors %}<div class="errors" role="alert">Email or password not recognized.</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><div class="field"><label for="{{ form.username.id_for_label }}">Email</label>{{ form.username }}</div><div class="field"><label for="{{ form.password.id_for_label }}">Password</label>{{ form.password }}</div><button class="primary" type="submit">Sign in</button></form></section>{% endblock %}
